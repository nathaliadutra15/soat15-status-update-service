name: soat-status-update-service

services:
  status-update-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: 15soat-status-update-service:latest
    container_name: status-update-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3003:3003"
    networks:
      - 15soat-status-net

  db:
    image: mongo:8
    container_name: mongo-15soat-status-update-service
    restart: unless-stopped
    environment:
      MONGO_USER: ${DB_USER}
      MONGO_PASSWORD: ${DB_PASSWORD}
      MONGO_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - 15soat-status-net
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: secret
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

networks:
  15soat-status-net:
    driver: bridge

volumes:
  db_data:
  rabbitmq_data:

